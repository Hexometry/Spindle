services:
  - type: web
    name: spindle
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker only: the SpotAPI player session lives in memory.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SPINDLE_PLAYBACK_KEY
        sync: false
      - key: SPOTAPI_COOKIE_DUMP
        sync: false
